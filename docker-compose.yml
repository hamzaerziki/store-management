services:
  db:
    image: postgres:16-alpine
    container_name: safari_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-safari}
      POSTGRES_USER: ${DB_USER:-safari}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-safari_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-safari} -d ${DB_NAME:-safari}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: safari_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-safari}
      DB_USER: ${DB_USER:-safari}
      DB_PASSWORD: ${DB_PASSWORD:-safari_secret}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required and must be a long random secret}
      JWT_EXPIRES: ${JWT_EXPIRES:-12h}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-20000}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-10}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
      UPLOAD_DIR: /app/uploads
      DG_THRESHOLD: ${DG_THRESHOLD:-100000}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@safari.local}
    volumes:
      - upload_data:/app/uploads
      - ./backend/src:/app/src
      - ./backend/db:/app/db
    ports:
      - "${API_PORT:-4000}:4000"

  frontend:
    build: ./frontend
    container_name: safari_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  upload_data:
